<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#09080d" />
    <title>AuraTune</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px; color: #f8f6fc; background: #09080d; font: 15px/1.6 system-ui, sans-serif; }
      main { max-width: 420px; text-align: center; }
      .mark { width: 58px; height: 58px; margin: 0 auto 22px; display: grid; place-items: center; border-radius: 18px; background: #211532; color: #c5a3ff; font-size: 28px; }
      h1 { margin: 0 0 10px; font-size: 26px; letter-spacing: -.05em; }
      p { margin: 0; color: #a9a3b3; }
      code { color: #d2bdff; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">♫</div>
      <h1>AuraTune is almost ready</h1>
      <p>Configure <code>CAPACITOR_SERVER_URL</code> with your deployed AuraTune site, then sync the Android project again.</p>
    </main>
  </body>
</html>
